name: Release (signed APK + AAB)
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing. Run the 'Create keystore' workflow first (see PUBLISH.md)."; exit 1; fi
      - name: Organize files
        run: |
          mkdir -p www assets
          for f in index.html styles.css app.js sw.js manifest.json icon.svg icon-512.png privacy.html; do [ -f "$f" ] && mv "$f" www/; done
          for f in icon-only.png icon-foreground.png icon-background.png; do [ -f "$f" ] && mv "$f" assets/; done
          mkdir -p www/fonts
          B=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL "$B/amiriquran/AmiriQuran-Regular.ttf" -o www/fonts/AmiriQuran-Regular.ttf || true
          for w in Regular Medium Bold; do curl -fsSL "$B/tajawal/Tajawal-$w.ttf" -o "www/fonts/Tajawal-$w.ttf" || true; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
      - run: npx cap add android
      - name: Add vibrate permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.VIBRATE" "$M" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" */>#&\n    <uses-permission android:name="android.permission.VIBRATE" />#' "$M"
          grep -n "uses-permission" "$M"
      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"3.1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KP" \
            -Pandroid.injected.signing.key.alias="${KA:-mushaf}" \
            -Pandroid.injected.signing.key.password="$KP"
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
