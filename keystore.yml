name: Create keystore (run once)
on:
  workflow_dispatch:
jobs:
  ks:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.keystore -alias mushaf -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mushaf, O=Mushaf, C=TN"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=mushaf"
            echo "KEYSTORE_BASE64="
            base64 -w0 release.keystore
            echo
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
